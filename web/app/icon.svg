      <path d="M16 28S3 20 3 10.5A7.5 7.5 0 0 1 16 6a7.5 7.5 0 0 1 13 4.5c0 3.2-1.9 6.5-4.2 9.2L16 28z" fill="#ffffff" />
      <!-- Black circular bite cutouts taking a chunk out of the upper right -->
